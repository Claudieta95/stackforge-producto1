<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackForge - Gestión de usuarios</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar común: pendiente de incorporar -->

    <main class="container mt-5">

        <h1 class="text-center mb-5">
            Gestión de usuarios
        </h1>

        <div class="row">

            <!-- Columna izquierda: formulario -->
            <section class="col-lg-5">
                <h2 class="mb-4">Alta de usuarios</h2>

                <form id="formUsuario">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control"
                            id="nombre" name="nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control"
                            id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control"
                            id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn boton-alta">
                    Dar de alta
                    </button>

                </form>
            </section>

            <!-- Columna derecha: tabla -->

            <section class="col-lg-7">
                <h2 class="mb-4">Consulta y borrado de usuarios</h2>

                <div class="table-responsive">
                    <table class="table tabla-usuarios">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Contraseña</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaUsuarios">
                            <!-- Los usuarios se añadirán con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>


        </div>

    </main>

</body>
</html>
